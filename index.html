<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI EBRA - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-file-invoice"></i>
                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>
            </div>
            <h1><span>SI</span> EBRA</h1>
            <p class="subtitle">Sistem Ekstraksi Bukti Transfer</p>
        </div>

        <div class="divider">
            <span class="dot"></span>
        </div>

        <p class="instruction">Masukkan nomor induk karyawan dan password untuk masuk</p>

        <!-- Form Login -->
        <form id="signInForm">
            <div class="input-group">
                <i class="fa-solid fa-address-card input-icon"></i>
                <input type="text" id="nikInput" placeholder="Nomor Induk Karyawan" required> 
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="passwordInput" placeholder="Password" required>
                <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Ingat saya</span>
                </label>
                <a href="#" class="forgot-pass">Lupa password?</a>
            </div>

            <button type="submit" class="btn-masuk">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk
            </button>
        </form>

        <footer class="login-footer">
            © 2026 SI EBRA. All rights reserved.
        </footer>
    </div>

    <script type="module" src="beken/js/script.js"></script>
</body>
</html>
